apiVersion: v1
kind: Service
metadata:
  name: mlops-inference-service
  namespace: mlops-production
  labels:
    app: mlops-inference
    track: stable
    tier: serving
spec:
  type: ClusterIP
  selector:
    app: mlops-inference
    track: stable
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
---
