name: Enterprise MLOps CI/CD Pipeline

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      retrain_trigger:
        description: "Force trigger automated model retraining pipeline"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Job 1: Code Quality, Linting & Contract Static Analysis
  # ===========================================================================
  lint-and-quality:
    name: Code Quality & Static Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting & Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Execute Ruff Code Formatter & Linter
        run: |
          ruff check mlops_platform/ tests/ --ignore E501

  # ===========================================================================
  # Job 2: Data Pipeline, Model Training & MLflow Registry Verification
  # ===========================================================================
  data-and-training-pipeline:
    name: Data Pipeline, MLflow Tracking & ONNX Gate
    needs: lint-and-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Platform Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stage 1 Data Engineering & Schema Tests
        run: pytest -v tests/test_stage1_data.py

      - name: Run Stage 2 MLflow Experiment Tracking & Training Tests
        run: pytest -v tests/test_stage2_training.py

      - name: Run Stage 3 MLflow Model Registry & ONNX Acceleration Tests
        run: pytest -v tests/test_stage3_registry.py

  # ===========================================================================
  # Job 3: Serving Microservice, SHAP & Observability Validation
  # ===========================================================================
  serving-and-monitoring-pipeline:
    name: Serving Microservice, Telemetry & Drift Engine
    needs: data-and-training-pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Platform Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Stage 1-3 Ingestion to Seed Champion Artifacts
        run: |
          python run_stage1.py
          python run_stage2.py
          python run_stage3.py

      - name: Run Stage 4 Serving & SHAP Tests
        run: pytest -v tests/test_stage4_serving.py

      - name: Run Stage 7 Prometheus Telemetry & Metrics Tests
        run: pytest -v tests/test_stage7_monitoring.py

      - name: Run Stage 8 Statistical Drift & Retraining Tests
        run: pytest -v tests/test_stage8_drift.py

  # ===========================================================================
  # Job 4: Container Security, Multi-Stage Docker & Kubernetes Manifest Audit
  # ===========================================================================
  container-and-k8s-audit:
    name: Container Security & K8s Infrastructure Audit
    needs: serving-and-monitoring-pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Manifest Validation Tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run Stage 5 Dockerfile Architecture & Non-Root Tests
        run: pytest -v tests/test_stage5_docker.py

      - name: Run Stage 6 Kubernetes Manifests, HPA & Canary Tests
        run: pytest -v tests/test_stage6_k8s.py

      - name: Build Production Docker Image (Dry-Run Verification)
        run: |
          docker build --target runtime -t production-mlops-inference:test .

  # ===========================================================================
  # Job 5: Master End-to-End Verification & Test Coverage Gate
  # ===========================================================================
  master-e2e-verification:
    name: Master End-to-End Verification & Coverage Gate
    needs: container-and-k8s-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Platform Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Full End-to-End Test Suite with Code Coverage
        run: |
          pytest -v --cov=mlops_platform --cov-report=term-missing
